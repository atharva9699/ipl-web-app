<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ batsman }} Stats</title>
</head>
<body>
    <h1>{{ batsman }}'s Stats</h1>
    <ul>
        <li>Innings: {{ stats['innings'] }}</li>
        <li>Runs: {{ stats['runs'] }}</li>
        <li>Average: {{ stats['avg'] }}</li>
        <li>Strike Rate: {{ stats['strikeRate'] }}</li>
        <li>Fifties: {{ stats['fifties'] }}</li>
        <li>Hundreds: {{ stats['hundreds'] }}</li>
        <li>Highest Score: {{ stats['highestScore'] }}</li>
    </ul>
</body>
</html>
