<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ bowler }} Stats</title>
</head>
<body>
    <h1>{{ bowler }}'s Stats</h1>
    <ul>
        <li>Innings: {{ stats['innings'] }}</li>
        <li>Wickets: {{ stats['wicket'] }}</li>
        <li>Economy: {{ stats['economy'] }}</li>
        <li>Average: {{ stats['average'] }}</li>
        <li>Strike Rate: {{ stats['strikeRate'] }}</li>
        <li>Best Bowling: {{ stats['best_figure'] }}</li>
    </ul>
</body>
</html>
